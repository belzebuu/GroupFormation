[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "prensio"
version = "0.0.1"
authors = [
  { name="Marco Chiarandini", email="marco@imada.sdu.dk" },
]
description = "A program to group students in teams controlling for within group heterogeneity and between group homogeneity"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "gurobipy>=13.0.0",
    "openpyxl>=3.1.3",
    "pandas>=1.1.5",
    "pyyaml>=6.0.1",
    "tabulate>=0.9.0",
]

[project.urls]
"Homepage" = "https://github.com/belzebuu/GroupFormation"
"Bug Tracker" = "https://github.com/belzebuu/GroupFormation/issues"

[dependency-groups]
dev = [
    "mypy>=1.4.1",
    "ruff>=0.12.11",
]

